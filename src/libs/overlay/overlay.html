<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: transparent;
      overflow: hidden;
      pointer-events: none;   /* 完全穿透鼠标事件 */
      user-select: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background-color: transparent;
      pointer-events: none;   /* 确保 canvas 也不拦截事件 */
    }
  </style>
</head>
<body>
  <canvas id="renderCanvas"></canvas>
</body>
</html>
